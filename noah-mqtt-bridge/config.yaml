name: "Growatt Noah MQTT Bridge"
description: "Holt Daten deines Noah Speichers in dein Home Assistant"
version: "1.1.1"
slug: "noah_mqtt"
boot: "auto"        # Startet das Add-on automatisch beim HA-Boot
arch:
  - aarch64
  - amd64
  - armhf
init: false
map:
  - config:rw # Erlaubt Zugriff auf das Config-Verzeichnis (für Cookies)
options:
  username: ""
  password: ""
  mqtt_server: "mqtt://core-mosquitto"
  mqtt_user: ""
  mqtt_password: ""
  interval: 60
schema:
  username: str
  password: password
  mqtt_server: str
  mqtt_user: str?
  mqtt_password: password?
  interval: int(60,)