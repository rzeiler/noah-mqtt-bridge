name: "Growatt Noah MQTT Bridge"
description: "Holt Daten deines Noah Speichers in dein Home Assistant"
version: "1.0.0"
slug: "noah_mqtt"
boot: auto        # Startet das Add-on automatisch beim HA-Boot
watchdog: true    # Startet das Add-on automatisch neu, falls es abstürzt
arch:
  - aarch64
  - amd64
  - armv7
init: false
map:
  - config:rw # Erlaubt Zugriff auf das Config-Verzeichnis (für Cookies)
options:
  username: ""
  password: ""
  mqtt_server: "mqtt://192.168.178.x"
  mqtt_user: ""
  mqtt_password: ""
  interval: 60
schema:
  username: str
  password: password
  mqtt_server: str
  mqtt_user: str?
  mqtt_password: password?
  interval: int(60,)